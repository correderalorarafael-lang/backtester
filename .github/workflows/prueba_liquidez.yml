name: prueba-liquidez
on:
  workflow_dispatch:  # solo a mano: prueba de solo lectura de medidas de liquidez
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - run: python indice/probar_liquidez.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
